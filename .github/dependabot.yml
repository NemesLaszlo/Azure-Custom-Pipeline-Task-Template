version: 2
updates:
  - package-ecosystem: npm
    directory: /buildandreleasetask
    schedule:
      interval: monthly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # @types/node must match the Node handler the task runs on (Node 24).
      # Bump it by hand together with the execution handlers in task.json.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
